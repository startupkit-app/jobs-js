<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Apply — @startupkit/jobs browser example</title>
  <!-- Cloudflare Turnstile (only needed when the job requires it) -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input, textarea { width: 100%; padding: 0.5rem; margin-top: 0.25rem; box-sizing: border-box; }
    button { margin-top: 1.5rem; padding: 0.6rem 1.2rem; }
    #status { margin-top: 1rem; }
  </style>
</head>
<body>
  <h1 id="job-title">Loading…</h1>
  <div id="job-description"></div>

  <form id="apply-form" hidden>
    <label>Email *<input type="email" name="email" required autofocus /></label>
    <label>First name<input type="text" name="first_name" /></label>
    <label>Last name<input type="text" name="last_name" /></label>
    <label>Resume (PDF)<input type="file" name="resume" accept="application/pdf" /></label>
    <div id="questions"></div>
    <div id="consent"></div>
    <div id="turnstile-widget"></div>
    <button type="submit">Apply</button>
    <p id="status"></p>
  </form>

  <script type="module">
    // In your app: import { createClient } from "@startupkit/jobs";
    import { createClient, KitApiError } from "https://esm.sh/@startupkit/jobs@0.1.0";

    const PUBLISHABLE_KEY = "pk_live_REPLACE_ME"; // pk_ keys are browser-safe
    const JOB_TOKEN = new URLSearchParams(location.search).get("job") ?? "REPLACE_ME";

    const kit = createClient({ publishableKey: PUBLISHABLE_KEY });
    const form = document.getElementById("apply-form");
    const status = document.getElementById("status");

    const job = await kit.getJob(JOB_TOKEN);

    document.getElementById("job-title").textContent = job.title;
    document.getElementById("job-description").innerHTML = job.description_html;
    document.getElementById("consent").innerHTML =
      job.application_form.consent_disclosure_html;

    // Render screening questions
    const questionsEl = document.getElementById("questions");
    for (const question of job.application_form.questions) {
      const label = document.createElement("label");
      label.textContent = question.prompt + (question.required ? " *" : "");
      const input = document.createElement("textarea");
      input.name = `question:${question.key}`;
      input.required = question.required;
      input.maxLength = question.max_length;
      label.appendChild(input);
      questionsEl.appendChild(label);
    }

    // Render Turnstile when the job requires it
    let turnstileToken;
    if (job.application_form.turnstile.required) {
      window.turnstile?.render("#turnstile-widget", {
        sitekey: job.application_form.turnstile.sitekey,
        callback: (token) => { turnstileToken = token; },
      });
    }

    if (job.accepting_applications) form.hidden = false;
    else status.textContent = "This job is no longer accepting applications.";

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      status.textContent = "Submitting…";
      const data = new FormData(form);

      try {
        // 1. Upload the resume (optional)
        let resume_signed_id;
        const resume = data.get("resume");
        if (resume instanceof File && resume.size > 0) {
          status.textContent = "Uploading resume…";
          ({ signed_id: resume_signed_id } = await kit.uploadFile(resume));
        }

        // 2. Collect screening question answers
        const responses = {};
        for (const question of job.application_form.questions) {
          const answer = data.get(`question:${question.key}`);
          if (answer) responses[question.key] = String(answer);
        }

        // 3. Submit the application
        const result = await kit.apply(
          job.id,
          {
            email: String(data.get("email")),
            first_name: String(data.get("first_name") || "") || undefined,
            last_name: String(data.get("last_name") || "") || undefined,
            responses,
            resume_signed_id,
          },
          { turnstileToken }
        );

        status.textContent = `Application ${result.id} submitted. Good luck!`;
        form.querySelector("button").disabled = true;
      } catch (error) {
        if (error instanceof KitApiError) {
          if (error.code === "already_applied") {
            status.textContent = "You have already applied to this job.";
          } else if (error.fields) {
            status.textContent = Object.entries(error.fields)
              .map(([field, messages]) => `${field}: ${messages.join(", ")}`)
              .join(" · ");
          } else {
            status.textContent = error.message;
          }
        } else {
          status.textContent = "Network error — please try again.";
        }
      }
    });
  </script>
</body>
</html>
