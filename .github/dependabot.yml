version: 2

updates:
  # ---------------------------------------------------------------------------
  # npm dependencies
  #
  # This package ships zero runtime dependencies - everything here is a
  # devDependency (tsup, vitest, typescript, changesets, publint, attw), so
  # these updates affect the build/test toolchain and never the published
  # dependency tree.
  #
  # `cooldown` mirrors the 7-day `min-release-age` in .npmrc so Dependabot does
  # not open PRs for versions the local/CI install would refuse to resolve.
  # ---------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 7
    groups:
      # Collapse the routine minor/patch churn into a single weekly PR.
      # Majors are deliberately left ungrouped so each one gets its own PR
      # and its own review.
      npm-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # TypeScript 7.0 is the native Go port, and its `exports` map no longer
      # exposes the JS compiler API. `tsc` itself works, but tsup's bundled
      # rollup-plugin-dts does `require("typescript")` to emit declarations and
      # fails with "Cannot read properties of undefined (reading
      # 'useCaseSensitiveFileNames')". tsup 8.5.1 is the newest release and
      # predates this.
      #
      # Scoped to 7.0.x deliberately: 7.1 and later still get PRs, so this stops
      # the weekly noise without hiding the release that fixes it. tsup itself is
      # NOT ignored, so an upstream fix arrives through its own update.
      - dependency-name: "typescript"
        versions: ["7.0.x"]

      # @types/node tracks the `engines.node` floor (>=20.19.0), which is also the
      # lowest leg of the CI matrix, so the types and the oldest supported runtime
      # agree. Typing against a much newer major would let code compile against
      # APIs that do not exist on the minimum supported Node.
      #
      # Revisit whenever engines.node moves - this pin should move with it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # ---------------------------------------------------------------------------
  # GitHub Actions
  #
  # Only two workflows here (ci.yml, release.yml) - release.yml publishes to npm
  # via Trusted Publishing (OIDC), so action bumps in it deserve a careful read.
  #
  # NOTE: the github-actions ecosystem supports `default-days` ONLY - the
  # semver-*-days variants are not honored here (actions are not SemVer-bump
  # classified by Dependabot).
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
