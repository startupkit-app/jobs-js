name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read
  # Required for npm Trusted Publishing (OIDC) — no NPM_TOKEN secret needed.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Opt-in switch. Set the repo variable NPM_PUBLISH_ENABLED=true once the npm
    # Trusted Publisher is configured (npmjs.com → package → Settings → Publishing).
    if: ${{ vars.NPM_PUBLISH_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing / OIDC requires npm >= 11.5.1; Node 22 ships npm 10.x.
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run build

      # Publish only when this version isn't already on the registry, so re-runs
      # and unrelated pushes are no-ops. Auth is via OIDC Trusted Publishing —
      # no token — and provenance is attached automatically.
      - name: Publish to npm
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} already published — skipping."
          else
            npm publish
          fi
